# Herdr config. Installed by install.sh / install.ps1.
onboarding = false

[ui.toast]
delivery = "system"

[theme]
name = "catppuccin"
auto_switch = false

[ui]
status_indicators = "symbols"
sidebar_width = 50

[[keys.command]]
key = "prefix+alt+w"
type = "plugin_action"
command = "repo-worktrees.new-worktree"

[[keys.command]]
key = "prefix+alt+s"
type = "plugin_action"
command = "user-secrets.open"
description = "open .NET user-secrets"
